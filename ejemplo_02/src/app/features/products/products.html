<h1>PRODUCTOS</h1>

<section>
    @for (product of products(); track product.id) {
        <article>
            <img [src]="product.image" [alt]="product.title" />
            <h2>{{ product.title }}</h2>
            <button type="button" (click)="openForm()" [attr.aria-expanded]="showForm()">Nuevo</button>
                @if (showForm()) {
                <div>
                    <h2>Nuevo producto</h2>

                    <label for="title">Título</label>
                    <input id="title" type="text" [value]="title()" (input)="setTitle($event)" />

                    <label for="price">Precio (€)</label>
                    <input id="price" type="number" min="0" step="0.01" [value]="price()"
                    (input)="setPrice($event)" />

                    <label for="description">Descripción</label>
                    <textarea id="description" rows="3" [value]="description()"
                    (input)="setDescription($event)"></textarea>

                    <label for="category">Categoría</label>
                    <select id="category" (input)="setCategory($event)">
                    @for (option of categories; track option) {
                    <option [value]="option" [selected]="option === category()">{{ option }}</option>
                    }
                    </select>

                    <label for="image">Imagen</label>
                    <input id="image" type="text" placeholder="/images/1.png" [value]="image()"
                    (input)="setImage($event)" />

                    <div>
                        <button type="button" (click)="addProduct()" [disabled]="!title()">Guardar</button>
                        <button type="button" (click)="closeForm()">Cancelar</button>
                    </div>


                </div>
                }
            <p>{{ product.category }}</p>
            <p>{{ product.price }} €</p>
            <p>★ {{ product.rating.rate }} ({{ product.rating.count }} valoraciones)</p>
            <button type="button" (click)="deleteProduct(product.id)" [attr.aria-label]="'Borrar ' +
            product.title">Borrar</button>
        </article>
    }@empty {
        <p>no hay productos</p>
    }
</section>
